name: Check MicroFantasy firmware
on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/microfantasy-firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/microfantasy-firmware.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install platformio==6.2.0
      - name: Test quadrature and position math
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Ifirmware/microfantasy-xiao/include firmware/microfantasy-xiao/test/position_test.cpp -o /tmp/position-test
          /tmp/position-test
      - name: Test X reference state and retry safety
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Ifirmware/microfantasy-xiao/include firmware/microfantasy-xiao/test/x_reference_test.cpp -o /tmp/x-reference-test
          /tmp/x-reference-test
      - name: Test Wi-Fi provisioning recovery
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Ifirmware/microfantasy-xiao/include firmware/microfantasy-xiao/test/wifi_setup_test.cpp -o /tmp/wifi-setup-test
          /tmp/wifi-setup-test
      - name: Test Wi-Fi reconnect timing
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Ifirmware/microfantasy-xiao/include firmware/microfantasy-xiao/test/wifi_reconnect_test.cpp -o /tmp/wifi-reconnect-test
          /tmp/wifi-reconnect-test
      - name: Build XIAO ESP32-C3 firmware
        run: pio run -d firmware/microfantasy-xiao -e xiao_esp32c3
      - name: Test X reference wire contract with firmware ArduinoJson
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -Ifirmware/microfantasy-xiao/include -Ifirmware/microfantasy-xiao/.pio/libdeps/xiao_esp32c3/ArduinoJson/src firmware/microfantasy-xiao/test/x_reference_protocol_test.cpp -o /tmp/x-reference-protocol-test
          /tmp/x-reference-protocol-test
