name: Publish MicroFantasy Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: microfantasy-android-release
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: microfantasy
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify signing setup
        env:
          KEYSTORE: ${{ secrets.MICROFANTASY_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MICROFANTASY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MICROFANTASY_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MICROFANTASY_KEY_ALIAS }}
          EXPECTED_CERTIFICATE: ${{ vars.MICROFANTASY_SIGNING_SHA256 }}
        run: |
          if [[ -z "$KEYSTORE" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" || -z "$KEY_ALIAS" || -z "$EXPECTED_CERTIFICATE" ]]; then
            echo "::error::Run microfantasy/tool/setup-github-updates.ps1 once to configure Android signing secrets."
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze and test
        run: |
          dart format --output=none --set-exit-if-changed lib test tool
          dart analyze lib test tool
          flutter test --no-pub
          python3 -m unittest discover -s tool -p '*_test.py'

      - name: Allocate increasing Android version
        id: version
        run: python3 tool/android_release.py prepare

      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.MICROFANTASY_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/microfantasy-signing.keystore"

      - name: Build signed APK
        env:
          MICROFANTASY_KEYSTORE: ${{ runner.temp }}/microfantasy-signing.keystore
          MICROFANTASY_STORE_PASSWORD: ${{ secrets.MICROFANTASY_STORE_PASSWORD }}
          MICROFANTASY_KEY_PASSWORD: ${{ secrets.MICROFANTASY_KEY_PASSWORD }}
          MICROFANTASY_KEY_ALIAS: ${{ secrets.MICROFANTASY_KEY_ALIAS }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          chmod +x android/gradlew
          flutter build apk --release --no-pub --build-name="$VERSION_NAME" --build-number="$VERSION_CODE"

      - name: Verify APK and generate update manifest
        env:
          EXPECTED_CERTIFICATE_SHA256: ${{ vars.MICROFANTASY_SIGNING_SHA256 }}
        run: python3 tool/android_release.py package

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          gh release create "$TAG" build/release/microfantasy.apk build/release/microfantasy-update.json \
            --draft --target "$GITHUB_SHA" --title "MicroFantasy $VERSION_NAME" --notes-file build/release/notes.md
          gh release edit "$TAG" --draft=false --latest

      - name: Remove temporary signing material
        if: always()
        run: rm -f -- "$RUNNER_TEMP/microfantasy-signing.keystore"
